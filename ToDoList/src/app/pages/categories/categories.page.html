<!-- ======= HEADER PREMIUM ======= -->
<ion-header class="ion-no-border transparent-header">
  <ion-toolbar class="glass-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/todo-list" text="" icon="arrow-back-outline" class="custom-back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="header-title">Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<!-- ======= CONTENT ======= -->
<ion-content [fullscreen]="true" class="premium-bg">

  <!-- Fondo decorativo con blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="main-wrapper">

    <!-- ---- Input para agregar categoría ---- -->
    <div class="add-card glass-card">
      <p class="add-card-title">Nueva categoría</p>
      <div class="input-container">
        <div class="custom-input-wrap" [formGroup]="this.formCategory">
          <ion-icon name="pricetag-outline" class="input-icon"></ion-icon>
          <ion-input placeholder="Nombre de categoría..." class="custom-input" formControlName="name"></ion-input>
        </div>
        <button class="add-btn-full" (click)="save()">
          <span>{{ isUpdate ? 'Actualizar Categoria' : 'Crear Categoria' }}</span>
        </button>
      </div>
    </div>

    <!-- ---- Lista de Categorías ---- -->
    <div class="task-section">
      <h2 class="section-heading">
        <ion-icon name="pricetags-outline"></ion-icon> Tus Categorías
      </h2>

      @if (this.isLoading()) {
 <!-- SKELETON LOADER -->
          <app-loading-skeleton/>
      } @else{
  <ion-list class="tasks-list">
        @for (cat of categoryInformation(); track cat.id) {
          <ion-item-sliding>
            <ion-item lines="none" class="task-card">
              <div class="task-body">
                <div class="cat-icon">
                  <ion-icon name="folder-outline" ></ion-icon>
                </div>
                <div class="task-info">
                  <p class="task-title" >{{ cat.name }}</p>
                  <div class="task-meta">
                    <span class="task-date">{{cat.value}} Tareas</span>
                  </div>
                  <div class="task-meta">
                    <span class="task-date">Fecha de creacion: {{cat.created_at | date:'dd-mm-yyy | hh:mm:ss'}}</span>
                  </div>
                </div>
                <div class="task-actions">
                  <button class="action-icon edit-icon" (click)="getCategoryForId(cat.id)">
                    <ion-icon name="create-outline"></ion-icon>
                  </button>
                  <button class="action-icon delete-icon" (click)="deleteCategory(cat.id)">
                    <ion-icon name="trash-outline"></ion-icon>
                  </button>
                </div>
              </div>
            </ion-item>
          </ion-item-sliding>
        }
      </ion-list>
      }

    
    </div>

  </div>
</ion-content>
