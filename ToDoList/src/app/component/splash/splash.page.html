<ion-content [fullscreen]="true" class="splash-content">

  <!-- Partículas decorativas de fondo -->
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>

  <!-- Orbes de luz de fondo -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Contenido central -->
  <div class="splash-center">

    <!-- Logo animado -->
    <div class="logo-wrapper">
      <div class="logo-ring ring-outer"></div>
      <div class="logo-ring ring-middle"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="10" width="22" height="4" rx="2" fill="white" opacity="0.9"/>
          <rect x="8" y="20" width="32" height="4" rx="2" fill="white" opacity="0.7"/>
          <rect x="8" y="30" width="26" height="4" rx="2" fill="white" opacity="0.5"/>
          <circle cx="6" cy="12" r="3" fill="#a78bfa"/>
          <circle cx="6" cy="22" r="3" fill="#34d399"/>
          <circle cx="6" cy="32" r="3" fill="#fb923c"/>
        </svg>
      </div>
    </div>

    <!-- Nombre de la app -->
    <div class="app-name-wrapper">
      <h1 class="app-name">Lista de tareas</h1>
      <p class="app-tagline">Organiza tu día con estilo</p>
    </div>

    <!-- Loader de progreso -->
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>

    <p class="loader-text">Cargando...</p>

  </div>

  <!-- Versión de la app -->
  <div class="version-badge">v1.0.0</div>

</ion-content>
